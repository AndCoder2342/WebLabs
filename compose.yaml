services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weblab
      POSTGRES_USER: weblab
      POSTGRES_PASSWORD: weblab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weblab -d weblab"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://weblab:weblab@db:5432/weblab?sslmode=disable
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin777
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
