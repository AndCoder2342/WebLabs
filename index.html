<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <title>Лабараторная 1</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
  <header>
      <h1 class="cap" id="variant">Сафин Илья Дмитриевич P3206 Вариант: 95319 <a class="small-cap" href="https://github.com/AndCoder2342/WebLabs">GitHub</a></h1>
  </header>
  <main>
      <div class="workspace">
          <canvas id="canvas" width="1800" height="1800"></canvas>

          <div class="right-column">
              <form id="form">
                  <fieldset>
                      <legend>Координата Х</legend>

                      <button type="button" name="x" value="-2" aria-pressed="false">-2</button>
                      <button type="button" name="x" value="-1.5" aria-pressed="false">-1.5</button>
                      <button type="button" name="x" value="-1" aria-pressed="false">-1</button>
                      <button type="button" name="x" value="-0.5" aria-pressed="false">-0.5</button>
                      <button type="button" name="x" value="0" aria-pressed="false">0</button>
                      <button type="button" name="x" value="0.5" aria-pressed="false">0.5</button>
                      <button type="button" name="x" value="1" aria-pressed="false">1</button>
                      <button type="button" name="x" value="1.5" aria-pressed="false">1.5</button>
                      <button type="button" name="x" value="2" aria-pressed="false">2</button>

                  </fieldset>
                  <div class="cord-y">
                      <label for="y_input">Координата Y</label>
                      <input id="y_input" type="text" required inputmode="decimal" pattern="[\-+]?(?:\d+(?:[.,]\d+)?|[.,]\d+)" placeholder="−5 < Y < 3">
                  </div>

                  <fieldset>
                      <legend>Радиус R</legend>
                      <select id="r_input" name="r" required aria-label="Радиус R">
                          <option value="" disabled selected>Выберите R</option>
                          <option value="1">1</option>
                          <option value="1.5">1.5</option>
                          <option value="2">2</option>
                          <option value="2.5">2.5</option>
                          <option value="3">3</option>
                      </select>
                  </fieldset>
                  <p id="form_error" role="alert"></p>
                  <div id="button-row">
                      <button type="submit">Проверить точку</button>
                      <label><input id="show_all_points" type="checkbox" value="1">показать точки</label>
                      <select name="points_param" id="sort_points_param">
                          <option value="in">Попадания</option>
                          <option value="out">Промахи</option>
                          <option value="all" selected>Все</option>
                          </select>

                  </div>

                  <div id="sort">
                      <h2>Результаты проверок</h2>
                      <select name="param" id="sort_param">
                          <option value="x">По X</option>
                          <option value="y">По Y</option>
                          <option value="r">По R</option>
                          <option value="date" selected>По Дате</option>
                      </select>
                      <select name="option" id="sort_option">
                          <option value=">">По Возрастанию</option>
                          <option value="<" selected>По Убыванию</option>

                      </select>
                  </div>


              </form>
              <section class="results">


                  <div class="table-container">
                      <table id="results-table">
                          <thead>
                          <tr>
                              <th scope="col">X</th>
                              <th scope="col">Y</th>
                              <th scope="col">R</th>
                              <th scope="col">Результат</th>
                              <th scope="col">Дата и время</th>
                          </tr>
                          </thead>

                          <tbody id="results_body">
                          </tbody>
                      </table>
                  </div>
              </section>
          </div>
      </div>
  </main>
  <footer>
      <p>2026 год</p>
  </footer>
</body>
</html>
